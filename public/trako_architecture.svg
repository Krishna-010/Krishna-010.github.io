<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600">
  <defs>
    <style>
      .bg { fill: #0b1121; }
      .box { fill: #0f172a; stroke: #1e293b; stroke-width: 2px; rx: 12px; }
      .box-green { fill: #0f172a; stroke: #10b981; stroke-width: 2px; rx: 12px; }
      .glow { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.3)); }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 400; text-anchor: middle; }
      .text-accent { fill: #10b981; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 3px; fill: none; }
      .line-green { stroke: #10b981; stroke-width: 3px; fill: none; }
      .arrow-head { fill: #475569; }
      .arrow-head-green { fill: #10b981; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head-green" />
    </marker>
  </defs>

  <rect width="1800" height="600" class="bg" />

  <!-- CENTRAL PRODUCT: TRAKO Jacket -->
  <g transform="translate(900, 220)">
    <g class="glow">
      <!-- Abstract Jacket Silhouette -->
      <path d="M -50 -70 Q 0 -80 50 -70 L 80 -40 L 110 30 L 80 40 L 60 -10 L 60 80 L -60 80 L -60 -10 L -80 40 L -110 30 L -80 -40 Z" fill="#1e293b" stroke="#10b981" stroke-width="3" stroke-linejoin="round"/>
      <line x1="0" y1="-75" x2="0" y2="80" stroke="#0b1121" stroke-width="4" />
    </g>
    <text x="0" y="125" class="text-title" style="font-size: 28px; letter-spacing: 2px;">TRAKO</text>
    <text x="0" y="155" class="text-accent">Smart Safety Wearable</text>
  </g>

  <!-- LEFT BRANCH: Health & Display Subsystem -->
  <rect x="250" y="80" width="220" height="80" class="box" />
  <text x="360" y="125" class="text-title">Pulse Sensor</text>
  
  <rect x="60" y="210" width="150" height="60" class="box" />
  <text x="135" y="245" class="text-sub">RTC / Time</text>

  <path d="M 360 160 L 360 190" class="line" marker-end="url(#arrow)" />
  <path d="M 210 240 L 240 240" class="line" marker-end="url(#arrow)" />

  <g class="glow">
    <rect x="250" y="200" width="220" height="80" class="box-green" />
  </g>
  <text x="360" y="245" class="text-title">Arduino Nano</text>

  <path d="M 360 280 L 360 310" class="line" marker-end="url(#arrow)" />

  <rect x="250" y="320" width="220" height="80" class="box" />
  <text x="360" y="365" class="text-title">OLED Display</text>

  <path d="M 470 240 L 780 240" class="line-green" marker-end="url(#arrow-green)" stroke-dasharray="8 4"/>
  <text x="625" y="225" class="text-sub" style="font-size: 12px;">Heart Rate + Time → Local Display</text>


  <!-- RIGHT BRANCH: Location & Safety Subsystem -->
  <rect x="1330" y="80" width="240" height="80" class="box" />
  <text x="1450" y="115" class="text-title">Location /</text>
  <text x="1450" y="140" class="text-title">Communication HW</text>

  <path d="M 1450 160 L 1450 190" class="line" marker-end="url(#arrow)" />

  <g class="glow">
    <rect x="1330" y="200" width="240" height="80" class="box-green" />
  </g>
  <text x="1450" y="245" class="text-title">Emergency Alert</text>

  <path d="M 1450 280 L 1450 310" class="line" marker-end="url(#arrow)" />

  <rect x="1330" y="320" width="240" height="80" class="box" />
  <text x="1450" y="355" class="text-title">SMS + Location Link</text>
  <!-- Mini Phone Icon -->
  <rect x="1420" y="370" width="16" height="24" rx="2" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle cx="1428" cy="380" r="2" fill="#10b981" />

  <path d="M 1020 240 L 1330 240" class="line-green" marker-end="url(#arrow-green)" stroke-dasharray="8 4"/>
  <text x="1175" y="225" class="text-sub" style="font-size: 12px;">Coordinates → Alert Trigger</text>

  <!-- BOTTOM LAYER: Product Development MVP Pipeline -->
  <rect x="100" y="460" width="1600" height="100" class="box" fill="rgba(15, 23, 42, 0.5)" />
  
  <text x="260" y="515" class="text-title" style="fill: #cbd5e1;">Prototype</text>
  <path d="M 340 508 L 410 508" class="line" marker-end="url(#arrow)" />
  
  <text x="500" y="515" class="text-title" style="fill: #cbd5e1;">User Feedback</text>
  <path d="M 590 508 L 660 508" class="line" marker-end="url(#arrow)" />
  
  <text x="740" y="515" class="text-title" style="fill: #cbd5e1;">Cost Analysis</text>
  <path d="M 830 508 L 900 508" class="line" marker-end="url(#arrow)" />
  
  <text x="1000" y="515" class="text-title" style="fill: #cbd5e1;">Product Planning</text>

  <!-- BOM Metric Card -->
  <rect x="1250" y="440" width="380" height="140" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="12" />
  <text x="1440" y="480" class="text-sub">Prototype Component BOM</text>
  <text x="1440" y="525" class="text-title" style="font-size: 36px; fill: #10b981;">₹2,724</text>
  <text x="1440" y="555" class="text-sub" style="font-size: 13px;">Initial component estimate</text>

</svg>
