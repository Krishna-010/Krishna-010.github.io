<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <style>
    .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #a3a3a3; font-size: 16px; font-weight: 500; text-anchor: middle; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e5e5e5; font-size: 22px; font-weight: 600; text-anchor: middle; }
    .bg-panel { fill: #121212; }
    .border-stroke { stroke: #333333; stroke-width: 1; fill: none; }
  </style>

  <rect class="bg-panel" width="1200" height="600" rx="16" />
  <rect class="border-stroke" width="1200" height="600" rx="16" />

  <text x="300" y="50" class="text-title">6-Exposure LDR Sequence</text>
  
  <image href="Watch_1.jpg" x="40" y="80" width="160" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip1)" />
  <image href="Watch_2.jpg" x="220" y="80" width="160" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip2)" />
  <image href="Watch_3.jpg" x="400" y="80" width="160" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip3)" />
  
  <text x="120" y="305" class="text-label">EV 1 (0.0333 s)</text>
  <text x="300" y="305" class="text-label">EV 2 (0.1 s)</text>
  <text x="480" y="305" class="text-label">EV 3 (0.3 s)</text>

  <image href="Watch_4.jpg" x="40" y="330" width="160" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip4)" />
  <image href="Watch_5.jpg" x="220" y="330" width="160" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip5)" />
  <image href="Watch_6.jpg" x="400" y="330" width="160" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip6)" />

  <text x="120" y="555" class="text-label">EV 4 (1.0 s)</text>
  <text x="300" y="555" class="text-label">EV 5 (2.5 s)</text>
  <text x="480" y="555" class="text-label">EV 6 (4.0 s)</text>

  <!-- Connection Arrow -->
  <path d="M 580 310 L 640 310" stroke="#4a4a4a" stroke-width="3" fill="none" marker-end="url(#arrowhead)" />
  <text x="615" y="295" class="text-label" style="font-size: 14px;">makehdr</text>

  <text x="910" y="50" class="text-title">Tone-Mapped HDR Result</text>

  <image href="Watch_HDR_Result.png" x="690" y="80" width="440" height="450" preserveAspectRatio="xMidYMid slice" clip-path="url(#clipResult)" />
  <text x="910" y="555" class="text-label">MATLAB Reconstructed Image</text>

  <defs>
    <clipPath id="clip1"><rect x="40" y="80" width="160" height="200" rx="8" /></clipPath>
    <clipPath id="clip2"><rect x="220" y="80" width="160" height="200" rx="8" /></clipPath>
    <clipPath id="clip3"><rect x="400" y="80" width="160" height="200" rx="8" /></clipPath>
    <clipPath id="clip4"><rect x="40" y="330" width="160" height="200" rx="8" /></clipPath>
    <clipPath id="clip5"><rect x="220" y="330" width="160" height="200" rx="8" /></clipPath>
    <clipPath id="clip6"><rect x="400" y="330" width="160" height="200" rx="8" /></clipPath>
    <clipPath id="clipResult"><rect x="690" y="80" width="440" height="450" rx="12" /></clipPath>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4a4a" />
    </marker>
  </defs>
</svg>
