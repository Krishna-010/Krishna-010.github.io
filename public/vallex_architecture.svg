<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600">
  <defs>
    <style>
      .bg { fill: #0b1121; }
      .box { fill: #0f172a; stroke: #1e293b; stroke-width: 2px; rx: 12px; }
      .box-green { fill: #0f172a; stroke: #10b981; stroke-width: 2px; rx: 12px; }
      .box-dashed { fill: transparent; stroke: #475569; stroke-width: 2px; stroke-dasharray: 8 4; rx: 12px; }
      .glow { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.25)); }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 400; text-anchor: middle; }
      .text-accent { fill: #10b981; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 3px; fill: none; }
      .line-green { stroke: #10b981; stroke-width: 3px; fill: none; }
      .line-dashed { stroke: #475569; stroke-width: 3px; fill: none; stroke-dasharray: 8 6; }
      .arrow-head { fill: #475569; }
      .arrow-head-green { fill: #10b981; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head-green" />
    </marker>
  </defs>

  <rect width="1800" height="600" class="bg" />

  <!-- 1. Custom Recording UI -->
  <rect x="40" y="240" width="180" height="100" class="box" />
  <circle cx="130" cy="275" r="14" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 130 268 L 130 282 M 125 282 L 135 282" stroke="#10b981" stroke-width="2" />
  <text x="130" y="315" class="text-title" style="font-size: 16px;">Custom Recording UI</text>
  <text x="130" y="330" class="text-sub" style="font-size: 12px;">English + Japanese Speech</text>
  <path d="M 220 290 L 250 290" class="line" marker-end="url(#arrow)" />

  <!-- 2. Dataset -->
  <rect x="270" y="160" width="200" height="260" class="box" />
  <text x="370" y="200" class="text-title">Custom Dataset</text>
  
  <rect x="290" y="220" width="160" height="60" fill="#1e293b" rx="6" />
  <text x="370" y="245" class="text-title" style="font-size: 14px;">English</text>
  <text x="370" y="265" class="text-sub" style="font-size: 12px;">808 utterances • 80.5 min</text>

  <rect x="290" y="290" width="160" height="60" fill="#1e293b" rx="6" />
  <text x="370" y="315" class="text-title" style="font-size: 14px;">Japanese</text>
  <text x="370" y="335" class="text-sub" style="font-size: 12px;">276 utterances • 17.2 min</text>

  <text x="370" y="390" class="text-accent" style="font-size: 13px;">1,084 utterances • 97.7 min</text>
  
  <path d="M 470 290 L 510 290" class="line" marker-end="url(#arrow)" />

  <!-- 3. Input Representation -->
  <rect x="530" y="160" width="220" height="260" class="box" />
  <text x="640" y="200" class="text-title">Input Representation</text>

  <rect x="550" y="220" width="180" height="60" fill="none" stroke="#475569" stroke-width="1" rx="6" />
  <text x="640" y="245" class="text-title" style="font-size: 14px;">Text Input</text>
  <text x="640" y="265" class="text-sub" style="font-size: 12px;">Phoneme Sequence</text>

  <rect x="550" y="290" width="180" height="70" fill="none" stroke="#475569" stroke-width="1" rx="6" />
  <text x="640" y="315" class="text-title" style="font-size: 14px;">Speaker Audio</text>
  <text x="640" y="335" class="text-sub" style="font-size: 12px;">24 kHz Neural Audio Codec</text>
  <text x="640" y="350" class="text-sub" style="font-size: 11px;">8-code representation @ 75 Hz</text>

  <path d="M 750 290 L 790 290" class="line" marker-end="url(#arrow)" />

  <!-- 4. Pretrained VALL-E X -->
  <g class="glow">
    <rect x="810" y="210" width="220" height="160" class="box" fill="#1e293b" stroke="#3b82f6" />
  </g>
  <text x="920" y="250" class="text-title">Pretrained VALL-E X</text>
  <rect x="840" y="270" width="160" height="30" fill="#0f172a" rx="4" />
  <text x="920" y="290" class="text-sub" style="font-size: 13px;">AR Decoder</text>
  <rect x="840" y="310" width="160" height="30" fill="#0f172a" rx="4" />
  <text x="920" y="330" class="text-sub" style="font-size: 13px;">NAR Decoder</text>

  <path d="M 1030 290 L 1070 290" class="line-green" marker-end="url(#arrow-green)" />

  <!-- 5. Speaker Adaptation -->
  <g class="glow">
    <rect x="1090" y="210" width="220" height="160" class="box-green" />
  </g>
  <text x="1200" y="255" class="text-title">Full-Parameter</text>
  <text x="1200" y="275" class="text-title">Fine-Tuning</text>
  <text x="1200" y="310" class="text-accent" style="font-size: 13px;">English Dataset</text>
  <text x="1200" y="330" class="text-accent" style="font-size: 13px;">200 Epochs</text>
  <text x="1200" y="350" class="text-sub" style="font-size: 13px;">GPU Compute</text>

  <!-- Future Work Branch -->
  <path d="M 1200 370 L 1200 410" class="line-dashed" marker-end="url(#arrow)" />
  <rect x="1100" y="420" width="200" height="60" class="box-dashed" />
  <text x="1200" y="445" class="text-sub" style="font-size: 12px;">Proposed Next Step:</text>
  <text x="1200" y="465" class="text-title" style="font-size: 14px; fill: #cbd5e1;">LoRA / PEFT</text>

  <path d="M 1310 290 L 1370 290" class="line-green" marker-end="url(#arrow-green)" />

  <!-- 6. Synthesized Speech & Tradeoff Result -->
  <rect x="1390" y="90" width="360" height="400" class="box" fill="rgba(15, 23, 42, 0.6)" />
  
  <rect x="1430" y="120" width="280" height="60" fill="#1e293b" rx="8" />
  <!-- Simple waveform graphic -->
  <path d="M 1520 150 L 1530 140 L 1540 160 L 1550 130 L 1560 170 L 1570 145 L 1580 155 L 1590 150" stroke="#10b981" stroke-width="3" fill="none" />
  <text x="1570" y="195" class="text-title">Personalized Speech Result</text>

  <!-- Tradeoff Panel -->
  <rect x="1420" y="220" width="145" height="150" fill="rgba(16, 185, 129, 0.05)" stroke="#10b981" stroke-width="1" rx="8" />
  <text x="1492" y="250" class="text-title" style="font-size: 14px; fill: #10b981;">Speaker Similarity</text>
  <text x="1492" y="290" class="text-title" style="font-size: 16px;">Timbre ↑</text>
  <text x="1492" y="320" class="text-title" style="font-size: 16px;">Intonation ↑</text>

  <rect x="1575" y="220" width="145" height="150" fill="rgba(245, 158, 11, 0.05)" stroke="#f59e0b" stroke-width="1" rx="8" />
  <text x="1647" y="250" class="text-title" style="font-size: 14px; fill: #f59e0b;">Speech Quality</text>
  <text x="1647" y="290" class="text-sub" style="font-size: 13px;">Syllable omissions</text>
  <text x="1647" y="320" class="text-title" style="font-size: 16px; fill: #ef4444;">Intelligibility ↓</text>

  <text x="1570" y="420" class="text-accent" style="font-size: 15px;">More speaker-like · Less linguistically reliable</text>

</svg>
